name: publish

# Pushing a v* tag cuts the release. The manual trigger stays as an escape hatch for
# re-running a failed publish without deleting and re-pushing the tag.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.3)"
        required: false
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version }}

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux installs from the portable archive (assets/install.sh), so there is no
          # installer to build — just the binaries the archive step picks up.
          - os: ubuntu-latest
            target: linux
            formats: ""
            slug: linux-x64
          - os: windows-latest
            target: win
            formats: "wix"
            slug: windows-x64
          # arm64 runner, so macOS releases are Apple Silicon only. `update::platform_target`
          # returns None on an Intel Mac, which surfaces as "no release build for macos-x86_64".
          - os: macos-15
            target: mac
            formats: "dmg,app"
            slug: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        # Tag pushes carry no inputs, so the version comes from the ref; dispatch runs supply
        # it directly. Everything downstream reads these outputs, never inputs.version.
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION="${VERSION#v}"
          else
            echo "::error::No tag or version input — push a v*.*.* tag or supply the version."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${VERSION}"

      - name: Update Version in Cargo.toml
        shell: bash
        # Member crates inherit via version.workspace = true, so the root is the only bump.
        run: |
          perl -0pi -e 's/(^version = ")[^"]+(")/${1}${{ steps.version.outputs.version }}${2}/m' Cargo.toml

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        # The second line is what gpui's wayland/x11 backends link against. Vulkan and EGL are
        # dlopen'd at runtime, so they need nothing here.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libdbus-1-dev pkg-config libssl-dev \
            libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      - name: Clean up macOS resources
        if: runner.os == 'macOS'
        run: |
          # Kill any lingering processes that might hold file locks
          pkill -f hdiutil || true
          pkill -f create-dmg || true
          # Clear temporary files
          rm -rf /tmp/*.dmg /var/tmp/*.dmg

      - name: Install cargo-packager
        if: matrix.formats != ''
        # Pinned: the desktop package injects a custom WiX fragment, so template drift in a
        # new packager release should be adopted deliberately, not picked up by surprise.
        run: cargo install cargo-packager --locked --version 0.11.8

      # One echo package carrying both frontends: the desktop app plus the `spotify` TUI. The
      # MSI also puts its install dir on PATH; the macOS bundle holds both in Contents/MacOS.
      - name: Build and Package
        shell: bash
        env:
          # Marks these binaries as release builds; `update::is_dev_build` refuses to
          # self-upgrade without it, so a working-tree build can never overwrite itself.
          ECHO_RELEASE: "1"
        run: |
          if [ -n "${{ matrix.formats }}" ]; then
            cargo packager --release -p echo-desktop --formats ${{ matrix.formats }}
          else
            cargo build --release -p echo-desktop -p spotify-tui
          fi

      # A gpui_platform missing its wayland/x11 features still compiles — it just yields a
      # desktop binary that panics instead of opening a window, which no build step notices.
      # libxkbcommon is linked only when those features are on, so it stands in for the whole
      # backend. v0.5.0 shipped without it.
      - name: Assert the Linux GUI backend is linked
        if: runner.os == 'Linux'
        run: ldd target/release/echo-desktop | grep -q libxkbcommon

      # The portable archive: what `spotify upgrade` and the desktop's update button pull on
      # every platform, and what install.sh lays down on Linux. It carries themes/ because
      # themes are loaded from the install directory — binaries alone would leave a release's
      # theme changes behind — and the hicolor icons install.sh files into the menu entry.
      - name: Build upgrade archive
        shell: bash
        run: |
          set -eu
          SUFFIX=""
          if [ "${{ runner.os }}" = "Windows" ]; then SUFFIX=".exe"; fi

          rm -rf pkg && mkdir -p pkg/icons
          for binary in echo-desktop spotify; do
            cp "target/release/${binary}${SUFFIX}" pkg/
          done
          cp -r themes pkg/themes
          for icon in 32x32.png 64x64.png 128x128.png "128x128@2x.png"; do
            cp "icons/$icon" pkg/icons/
          done

          tar -czf "target/release/echo-${{ matrix.slug }}.tar.gz" -C pkg .
          rm -rf pkg
          ls -la target/release/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: echo-${{ matrix.target }}
          path: |
            target/release/*.msi
            target/release/*.dmg
            target/release/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION="${VERSION#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p release-assets
          test -d artifacts
          find artifacts -type f -exec cp -v {} release-assets/ \;
          # The installers are fetched straight off the release, so they ship as assets too:
          # `curl .../releases/latest/download/install.sh`.
          cp -v assets/install.sh assets/install.ps1 release-assets/
          test "$(find release-assets -type f | wc -l)" -gt 0

          # On a tag push the tag already exists and --target would be rejected; on a manual
          # run the release has to be pinned to the branch it was dispatched from.
          TARGET=()
          if [[ "${{ github.ref }}" != refs/tags/* ]]; then
            TARGET=(--target "${{ github.ref_name }}")
          fi

          # Published, never draft: `releases/latest` does not see drafts, and that is the
          # endpoint the in-app updater queries.
          if [ -f release.md ] && [ -s release.md ]; then
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file release.md \
              "${TARGET[@]}" \
              release-assets/*
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              "${TARGET[@]}" \
              release-assets/*
          fi
