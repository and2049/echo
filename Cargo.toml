[workspace]
resolver = "3"
members = ["crates/*"]
# Bare `cargo run` / `cargo build` target the desktop app.
default-members = ["crates/echo-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
echo-core = { path = "crates/echo-core" }

anyhow = "1.0.102"
chrono = "0.4.44"
dirs = "6.0.0"
flate2 = "1.1.9"
futures-util = "0.3.32"
image = "0.25.10"
# Pinned: librespot has no compatible crates.io release, and an unpinned git dep
# means any fresh build can break independently of this repo's history.
# Upstream `dev` at 939dc5e, which includes `Spirc::clear_queue` (#1753).
librespot-connect = { git = "https://github.com/librespot-org/librespot", rev = "939dc5ee9d833e1980f9495241219d9d4868a061" }
librespot-core = { git = "https://github.com/librespot-org/librespot", rev = "939dc5ee9d833e1980f9495241219d9d4868a061" }
librespot-discovery = { git = "https://github.com/librespot-org/librespot", rev = "939dc5ee9d833e1980f9495241219d9d4868a061" }
librespot-oauth = { git = "https://github.com/librespot-org/librespot", rev = "939dc5ee9d833e1980f9495241219d9d4868a061" }
librespot-playback = { git = "https://github.com/librespot-org/librespot", rev = "939dc5ee9d833e1980f9495241219d9d4868a061", features = ["rodio-backend"] }
lofty = "0.24.0"
notify = "8.2.0"
parking_lot = "0.12.5"
reqwest = { version = "0.13.4", features = ["json"] }
rodio = "0.21.1"
rspotify = { version = "0.16.1", features = ["cli"] }
rustfft = "6.4.1"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
souvlaki = "0.8.3"
# Release archives are .tar.gz on every platform, Windows included, so the updater has one
# extraction path instead of a second zip branch.
tar = "0.4.44"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
urlencoding = "2.1.3"
webbrowser = "1.2.1"
