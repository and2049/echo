[workspace]
resolver = "3"
members = ["crates/*"]
# Bare `cargo run` / `cargo build` keep working on the TUI.
default-members = ["crates/spotify-tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
echo-core = { path = "crates/echo-core" }

anyhow = "1.0.102"
chrono = "0.4.44"
crossterm = "0.29.0"
dirs = "6.0.0"
futures-util = "0.3.32"
image = "0.25.10"
# Pinned: librespot has no compatible crates.io release, and an unpinned git dep
# means any fresh build can break independently of this repo's history.
librespot-connect = { git = "https://github.com/librespot-org/librespot", rev = "33bf3a77ed4b549df67e8347d7d6e55b007b3ec2" }
librespot-core = { git = "https://github.com/librespot-org/librespot", rev = "33bf3a77ed4b549df67e8347d7d6e55b007b3ec2" }
librespot-discovery = { git = "https://github.com/librespot-org/librespot", rev = "33bf3a77ed4b549df67e8347d7d6e55b007b3ec2" }
librespot-oauth = { git = "https://github.com/librespot-org/librespot", rev = "33bf3a77ed4b549df67e8347d7d6e55b007b3ec2" }
librespot-playback = { git = "https://github.com/librespot-org/librespot", rev = "33bf3a77ed4b549df67e8347d7d6e55b007b3ec2", features = ["rodio-backend"] }
lofty = "0.24.0"
notify = "8.2.0"
parking_lot = "0.12.5"
ratatui = "0.30.0"
reqwest = { version = "0.13.4", features = ["json"] }
rodio = "0.21.1"
rspotify = { version = "0.16.1", features = ["cli"] }
rustfft = "6.4.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
souvlaki = "0.8.3"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
unicode-segmentation = "1.13.2"
unicode-width = "0.2.2"
urlencoding = "2.1.3"
webbrowser = "1.2.1"
