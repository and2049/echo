[package]
name = "spotify-tui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "spotify"
path = "src/main.rs"

[dependencies]
echo-core = { workspace = true }

anyhow = { workspace = true }
crossterm = { workspace = true }
image = { workspace = true }
ratatui = { workspace = true }
ratatui-image = { workspace = true }
tokio = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }

[dev-dependencies]
# Redirects echo-core's config root before tests run (see redirect_config_for_tests).
ctor = "0.4"

# No `[package.metadata.packager]` here on purpose: the TUI is never packaged on its own. It
# ships inside the one echo package alongside the desktop app (see echo-desktop/Cargo.toml),
# so there is only ever one `spotify` command on a machine and one thing for `spotify upgrade`
# to replace.
