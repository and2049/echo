# Derived colors below the base nine are generated — after changing a base
# color, refresh them with: python themes/generate_desktop.py

primary = "#3e745d" # Accent: active tabs, the seek bar, links, the playing-track marker.

secondary = "#528e74" # Second accent: liked-track hearts, the condensed lyric line's neighbours.

background = "#d5e2d8" # The window background.

surface = "#e7f0ea" # Elevated panels: menus, modals, popovers, the titlebar.

text = "#3f5c4f" # Main text.

text_muted = "#849e8f" # Secondary text: artist/album columns, hints, timestamps, inactive icons.

highlight_bg = "#517b68" # Selection source color; selected rows derive their fill from this.

highlight_fg = "#e7f3eb" # Text on strong highlights (the TUI's selected rows).

error = "#ca4032" # Errors: failure messages and the audio-device banner.

row_selected = "#bbcdc2" # Any selected row/chip over the window: lists, sidebar, the command-bar suggestion (highlight_bg 20% over background).

row_hover = "#cddbd1" # Any hovered row over the window: sidebar, lists, tabs, links, range pills (text_muted 10% over background).

wash = "#c9d8cd" # Muted fills: placeholder cover boxes, small button hovers, disabled buttons (text_muted 15% over background).

border = "#bdcec2" # Window-level borders, pill outlines and the seek/volume bar track (text_muted 30% over background).

drag_target = "#b7ccbf" # Drag feedback: drop targets while dragging and the sidebar resize handle (primary 20% over background).

like_dim = "#93b6a2" # The faint heart on a not-liked track; hovering shows secondary itself (secondary 25% over background).

error_wash = "#d3cabf" # The audio-device failure banner fill (error 15% over background).

menu_hover = "#dde8e1" # Any hovered row, button or titlebar caption in menus and modals (text_muted 10% over surface).

menu_selected = "#c9d9d0" # Any selected menu/picker/suggestion row (highlight_bg 20% over surface).

menu_border = "#c4d3ca" # Borders in and around menus, modals, popovers and drag chips (text_muted 35% over surface).

danger_border = "#d8988e" # Confirm-prompt destructive button border (error 50% over surface).

danger_wash = "#e4dbd4" # That button's hover fill (error 12% over surface).
