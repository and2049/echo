# Derived colors below the base nine are generated — after changing a base
# color, refresh them with: python themes/generate_desktop.py

primary = "#ec8259" # Accent: active tabs, the seek bar, links, the playing-track marker.

secondary = "#fac563" # Second accent: liked-track hearts, the condensed lyric line's neighbours.

background = "#2b1515" # The window background.

surface = "#3d1f1c" # Elevated panels: menus, modals, popovers, the titlebar.

text = "#f9a877" # Main text.

text_muted = "#7c453d" # Secondary text: artist/album columns, hints, timestamps, inactive icons.

highlight_bg = "#cc494b" # Selection source color; selected rows derive their fill from this.

highlight_fg = "#221412" # Text on strong highlights (the TUI's selected rows).

error = "#f1cd9a" # Errors: failure messages and the audio-device banner.

row_selected = "#4b1f20" # Any selected row/chip over the window: lists, sidebar, the command-bar suggestion (highlight_bg 20% over background).

row_hover = "#331a19" # Any hovered row over the window: sidebar, lists, tabs, links, range pills (text_muted 10% over background).

wash = "#371c1b" # Muted fills: placeholder cover boxes, small button hovers, disabled buttons (text_muted 15% over background).

border = "#432321" # Window-level borders, pill outlines and the seek/volume bar track (text_muted 30% over background).

drag_target = "#522723" # Drag feedback: drop targets while dragging and the sidebar resize handle (primary 20% over background).

like_dim = "#5a3e30" # The faint heart on a not-liked track; hovering shows secondary itself (secondary 25% over background).

error_wash = "#493129" # The audio-device failure banner fill (error 15% over background).

menu_hover = "#43231f" # Any hovered row, button or titlebar caption in menus and modals (text_muted 10% over surface).

menu_selected = "#5a2725" # Any selected menu/picker/suggestion row (highlight_bg 20% over surface).

menu_border = "#532c28" # Borders in and around menus, modals, popovers and drag chips (text_muted 35% over surface).

danger_border = "#97765b" # Confirm-prompt destructive button border (error 50% over surface).

danger_wash = "#53342b" # That button's hover fill (error 12% over surface).
