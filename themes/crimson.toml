# Accent: active tabs, the seek bar, links, the playing-track marker.
primary = "#ec6d59"
# Second accent: liked-track hearts, the condensed lyric line's neighbours.
secondary = "#ffd993"
# The window background.
background = "#271618"
# Elevated panels: menus, modals, popovers, the titlebar.
surface = "#3a2124"
# Main text.
text = "#ff7560"
# Secondary text: artist/album columns, hints, timestamps, inactive icons.
text_muted = "#793939"
# Selection source color; selected rows derive their fill from this.
highlight_bg = "#cc494b"
# Text on strong highlights (the TUI's selected rows).
highlight_fg = "#221412"
# Errors: failure messages and the audio-device banner.
error = "#f3e5d1"

# Derived colors the desktop app paints — concrete values, no runtime
# transparency. Each comment states the formula they were generated with;
# edit freely, or delete a key (or this whole table) to fall back to the
# formula. Regenerate after changing base colors: python themes/generate_desktop.py
[desktop]
# Selected list-row pill (highlight_bg 20% over background).
row_selected = "#482022"
# Any hovered row over the window: sidebar, lists, quick links, range pills (text_muted 10% over background).
row_hover = "#2f1a1b"
# Muted fills: placeholder cover boxes, small button hovers, disabled buttons (text_muted 15% over background).
wash = "#331b1d"
# Window-level borders, pill outlines and the seek/volume bar track (text_muted 30% over background).
border = "#402022"
# Accent-tinted hover: tabs, links, active transport toggles (primary 12% over background).
accent_hover = "#3f2020"
# Accent-tinted selection: drop targets, resize handle, suggestion chip (primary 20% over background).
accent_selected = "#4e2725"
# The faint heart on a not-liked track; hovering shows secondary itself (secondary 25% over background).
like_dim = "#5d4737"
# The audio-device failure banner fill (error 15% over background).
error_wash = "#463534"
# Hovered row, button or titlebar caption in menus and modals (text_muted 10% over surface).
menu_hover = "#402326"
# Selected menu/picker row (highlight_bg 20% over surface).
menu_selected = "#57292c"
# Accent-tinted hover/selection in pickers, suggestions and modal controls (primary 12% over surface).
menu_accent = "#4f2a2a"
# Borders in and around menus, modals, popovers and drag chips (text_muted 35% over surface).
menu_border = "#50292b"
# Confirm-prompt destructive button border (error 50% over surface).
danger_border = "#96837a"
# That button's hover fill (error 12% over surface).
danger_wash = "#503939"
