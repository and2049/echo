# Derived colors below the base nine are generated — after changing a base
# color, refresh them with: python themes/generate_desktop.py

primary = "#00d9ff" # Accent: active tabs, the seek bar, links, the playing-track marker.

secondary = "#ebf744" # Second accent: liked-track hearts, the condensed lyric line's neighbours.

background = "#161618" # The window background.

surface = "#232328" # Elevated panels: menus, modals, popovers, the titlebar.

text = "#d8f588" # Main text.

text_muted = "#a4a28a" # Secondary text: artist/album columns, hints, timestamps, inactive icons.

highlight_bg = "#d0ff4f" # Selection source color; selected rows derive their fill from this.

highlight_fg = "#242436" # Text on strong highlights (the TUI's selected rows).

error = "#f75a2f" # Errors: failure messages and the audio-device banner.

row_selected = "#575e2d" # Any selected row/chip over the window: lists, sidebar, the command-bar suggestion (highlight_bg 20% over background).

row_hover = "#1a1a1e" # Any hovered row over the window: sidebar, lists, tabs, links, range pills (text_muted 10% over background).

wash = "#1b1c20" # Muted fills: placeholder cover boxes, small button hovers, disabled buttons (text_muted 15% over background).

border = "#202329" # Window-level borders, pill outlines and the seek/volume bar track (text_muted 30% over background).

drag_target = "#1a3b42" # Drag feedback: drop targets while dragging and the sidebar resize handle (primary 20% over background).

like_dim = "#2b2e35" # The faint heart on a not-liked track; hovering shows secondary itself (secondary 25% over background).

error_wash = "#39211b" # The audio-device failure banner fill (error 15% over background).

menu_hover = "#25262c" # Any hovered row, button or titlebar caption in menus and modals (text_muted 10% over surface).

menu_selected = "#464f30" # Any selected menu/picker/suggestion row (highlight_bg 20% over surface).

menu_border = "#2b2e36" # Borders in and around menus, modals, popovers and drag chips (text_muted 35% over surface).

danger_border = "#91472a" # Confirm-prompt destructive button border (error 50% over surface).

danger_wash = "#3d2d28" # That button's hover fill (error 12% over surface).
