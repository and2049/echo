# Derived colors below the base nine are generated — after changing a base
# color, refresh them with: python themes/generate_desktop.py

primary = "#2cabf5" # Accent: active tabs, the seek bar, links, the playing-track marker.

secondary = "#57e4e9" # Second accent: liked-track hearts, the condensed lyric line's neighbours.

background = "#202130" # The window background.

surface = "#2b2c40" # Elevated panels: menus, modals, popovers, the titlebar.

text = "#baffea" # Main text.

text_muted = "#505e68" # Secondary text: artist/album columns, hints, timestamps, inactive icons.

highlight_bg = "#39d1ff" # Selection source color; selected rows derive their fill from this.

highlight_fg = "#1b1a1f" # Text on strong highlights (the TUI's selected rows).

error = "Red" # Errors: failure messages and the audio-device banner.

row_selected = "#254459" # Any selected row/chip over the window: lists, sidebar, the command-bar suggestion (highlight_bg 20% over background).

row_hover = "#252736" # Any hovered row over the window: sidebar, lists, tabs, links, range pills (text_muted 10% over background).

wash = "#272a38" # Muted fills: placeholder cover boxes, small button hovers, disabled buttons (text_muted 15% over background).

border = "#2e3341" # Window-level borders, pill outlines and the seek/volume bar track (text_muted 30% over background).

drag_target = "#223d57" # Drag feedback: drop targets while dragging and the sidebar resize handle (primary 20% over background).

like_dim = "#2e525e" # The faint heart on a not-liked track; hovering shows secondary itself (secondary 25% over background).

error_wash = "#3a2330" # The audio-device failure banner fill (error 15% over background).

menu_hover = "#2f3144" # Any hovered row, button or titlebar caption in menus and modals (text_muted 10% over surface).

menu_selected = "#2e4d66" # Any selected menu/picker/suggestion row (highlight_bg 20% over surface).

menu_border = "#383e4e" # Borders in and around menus, modals, popovers and drag chips (text_muted 35% over surface).

danger_border = "#7c2e38" # Confirm-prompt destructive button border (error 50% over surface).

danger_wash = "#3e2d3e" # That button's hover fill (error 12% over surface).
