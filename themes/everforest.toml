# Derived colors below the base nine are generated — after changing a base
# color, refresh them with: python themes/generate_desktop.py

primary = "#A7C080" # Accent: active tabs, the seek bar, links, the playing-track marker.

secondary = "#c6dba4" # Second accent: liked-track hearts, the condensed lyric line's neighbours.

background = "#2d353b" # The window background.

surface = "#3d484d" # Elevated panels: menus, modals, popovers, the titlebar.

text = "#dbc9a1" # Main text.

text_muted = "#777e60" # Secondary text: artist/album columns, hints, timestamps, inactive icons.

highlight_bg = "#c4e491" # Selection source color; selected rows derive their fill from this.

highlight_fg = "#3d4050" # Text on strong highlights (the TUI's selected rows).

error = "#f5aa7e" # Errors: failure messages and the audio-device banner.

row_selected = "#4b584c" # Any selected row/chip over the window: lists, sidebar, the command-bar suggestion (highlight_bg 20% over background).

row_hover = "#343c3f" # Any hovered row over the window: sidebar, lists, tabs, links, range pills (text_muted 10% over background).

wash = "#384041" # Muted fills: placeholder cover boxes, small button hovers, disabled buttons (text_muted 15% over background).

border = "#434b46" # Window-level borders, pill outlines and the seek/volume bar track (text_muted 30% over background).

drag_target = "#455149" # Drag feedback: drop targets while dragging and the sidebar resize handle (primary 20% over background).

like_dim = "#414743" # The faint heart on a not-liked track; hovering shows secondary itself (secondary 25% over background).

error_wash = "#4b4745" # The audio-device failure banner fill (error 15% over background).

menu_hover = "#485457" # Any hovered row, button or titlebar caption in menus and modals (text_muted 10% over surface).

menu_selected = "#58675b" # Any selected menu/picker/suggestion row (highlight_bg 20% over surface).

menu_border = "#515b54" # Borders in and around menus, modals, popovers and drag chips (text_muted 35% over surface).

danger_border = "#997966" # Confirm-prompt destructive button border (error 50% over surface).

danger_wash = "#535453" # That button's hover fill (error 12% over surface).
