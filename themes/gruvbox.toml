# Accent: active tabs, the seek bar, links, the playing-track marker.
primary = "#458588"
# Second accent: liked-track hearts, the condensed lyric line's neighbours.
secondary = "#72a1a3"
# The window background.
background = "#282828"
# Elevated panels: menus, modals, popovers, the titlebar.
surface = "#3c3836"
# Main text.
text = "#ebdbb2"
# Secondary text: artist/album columns, hints, timestamps, inactive icons.
text_muted = "#7c7666"
# Selection source color; selected rows derive their fill from this.
highlight_bg = "#81c3c5"
# Text on strong highlights (the TUI's selected rows).
highlight_fg = "#3a3a3f"
# Errors: failure messages and the audio-device banner.
error = "#ee6e5d"

# Derived colors the desktop app paints — concrete values, no runtime
# transparency. Each comment states the formula they were generated with;
# edit freely, or delete a key (or this whole table) to fall back to the
# formula. Regenerate after changing base colors: python themes/generate_desktop.py
[desktop]
# Selected list-row pill (highlight_bg 20% over background).
row_selected = "#3a4747"
# Hovered sidebar row / quick link / range pill (text_muted 10% over background).
row_hover = "#30302e"
# Hovered main-area list row (text_muted 8% over background).
row_hover_faint = "#2f2e2d"
# Placeholder cover boxes, small round-button hover, disabled buttons (text_muted 15% over background).
wash_muted = "#353431"
# Seek and volume bar track (text_muted 25% over background).
bar_track = "#3d3c38"
# Window-level borders: sidebar edge, bar tops, input outlines (text_muted 30% over background).
border_soft = "#413f3b"
# Inactive pill outlines in the main area (text_muted 40% over background).
outline = "#4a4741"
# Hovered tab or link (primary 10% over background).
accent_wash = "#2b3132"
# Hovered active-state transport toggle (primary 15% over background).
accent_wash_icon = "#2c3636"
# Drag-over drop targets and the sidebar resize handle (primary 20% over background).
accent_wash_strong = "#2e3b3b"
# Selected command-bar suggestion chip (primary 25% over background).
suggestion_selected = "#2f3f40"
# Hovered play/pause and prev/next buttons (text 15% over background).
wash_fg = "#45433d"
# The faint heart on a not-liked track (secondary 25% over background).
like_dim = "#3a4647"
# That heart while hovered (secondary 70% over background).
like_hover = "#5c7d7e"
# The audio-device failure banner fill (error 15% over background).
error_wash = "#463230"
# Hovered menu/modal row (text_muted 10% over surface).
menu_hover = "#423e3b"
# Selected context/track-menu row (highlight_bg 20% over surface).
menu_row_selected = "#4a5453"
# Selected theme-picker row (text_muted 18% over surface).
menu_selected = "#48433f"
# Input and segmented-control outlines inside modals (text_muted 30% over surface).
menu_border_soft = "#4f4b44"
# Popover, modal and drag-chip borders (text_muted 40% over surface).
border_strong = "#565149"
# Selected/hovered row in pickers, menus and suggestions (primary 12% over surface).
picker_selected = "#3d4140"
# Hovered control inside modals (primary 10% over surface).
menu_accent_wash = "#3d403e"
# Confirm-prompt destructive button border (fixed danger red 50% over surface).
prompt_confirm_border = "#8e4544"
# That button's hover fill (fixed danger red 12% over surface).
prompt_confirm_wash = "#503b39"
# Confirm-prompt cancel button border (text_muted 50% over surface).
prompt_cancel_border = "#5c574e"
# That button's hover fill (text_muted 12% over surface).
prompt_cancel_wash = "#443f3c"
# Titlebar minimize/maximize caption hover (text 8% over surface).
titlebar_hover = "#4a4540"
# Those captions while pressed (text 12% over surface).
titlebar_active = "#514c45"
# The close caption while pressed (Windows red 80% over surface; its hover is the system red itself).
close_active = "#c61927"
