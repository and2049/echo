# Derived colors below the base nine are generated — after changing a base
# color, refresh them with: python themes/generate_desktop.py

primary = "#ff6481" # Accent: active tabs, the seek bar, links, the playing-track marker.

secondary = "#c4f765" # Second accent: liked-track hearts, the condensed lyric line's neighbours.

background = "#16161a" # The window background.

surface = "#232329" # Elevated panels: menus, modals, popovers, the titlebar.

text = "#faf6c6" # Main text.

text_muted = "#58584a" # Secondary text: artist/album columns, hints, timestamps, inactive icons.

highlight_bg = "#fdae66" # Selection source color; selected rows derive their fill from this.

highlight_fg = "#25251a" # Text on strong highlights (the TUI's selected rows).

error = "#f64b67" # Errors: failure messages and the audio-device banner.

row_selected = "#ca8461" # Any selected row/chip over the window: lists, sidebar, the command-bar suggestion (highlight_bg 20% over background).

row_hover = "#1b1b1e" # Any hovered row over the window: sidebar, lists, tabs, links, range pills (text_muted 10% over background).

wash = "#1e1d20" # Muted fills: placeholder cover boxes, small button hovers, disabled buttons (text_muted 15% over background).

border = "#252425" # Window-level borders, pill outlines and the seek/volume bar track (text_muted 30% over background).

drag_target = "#4d3736" # Drag feedback: drop targets while dragging and the sidebar resize handle (primary 20% over background).

like_dim = "#2e3128" # The faint heart on a not-liked track; hovering shows secondary itself (secondary 25% over background).

error_wash = "#381e26" # The audio-device failure banner fill (error 15% over background).

menu_hover = "#27262b" # Any hovered row, button or titlebar caption in menus and modals (text_muted 10% over surface).

menu_selected = "#5e3d3d" # Any selected menu/picker/suggestion row (highlight_bg 20% over surface).

menu_border = "#302f31" # Borders in and around menus, modals, popovers and drag chips (text_muted 35% over surface).

danger_border = "#8c3748" # Confirm-prompt destructive button border (error 50% over surface).

danger_wash = "#3c2830" # That button's hover fill (error 12% over surface).
