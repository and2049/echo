# Derived colors below the base nine are generated — after changing a base
# color, refresh them with: python themes/generate_desktop.py

primary = "#a6adb0" # Accent: active tabs, the seek bar, links, the playing-track marker.

secondary = "#a6adb0" # Second accent: liked-track hearts, the condensed lyric line's neighbours.

background = "#141314" # The window background.

surface = "#201f21" # Elevated panels: menus, modals, popovers, the titlebar.

text = "#d0d4d4" # Main text.

text_muted = "#5a6268" # Secondary text: artist/album columns, hints, timestamps, inactive icons.

highlight_bg = "#c0d1d6" # Selection source color; selected rows derive their fill from this.

highlight_fg = "#1e1e20" # Text on strong highlights (the TUI's selected rows).

error = "#a94039" # Errors: failure messages and the audio-device banner.

row_selected = "#36393b" # Any selected row/chip over the window: lists, sidebar, the command-bar suggestion (highlight_bg 20% over background).

row_hover = "#1b1b1c" # Any hovered row over the window: sidebar, lists, tabs, links, range pills (text_muted 10% over background).

wash = "#1e1f21" # Muted fills: placeholder cover boxes, small button hovers, disabled buttons (text_muted 15% over background).

border = "#292b2d" # Window-level borders, pill outlines and the seek/volume bar track (text_muted 30% over background).

drag_target = "#313233" # Drag feedback: drop targets while dragging and the sidebar resize handle (primary 20% over background).

like_dim = "#262a2c" # The faint heart on a not-liked track; hovering shows secondary itself (secondary 25% over background).

error_wash = "#2a1a1a" # The audio-device failure banner fill (error 15% over background).

menu_hover = "#262628" # Any hovered row, button or titlebar caption in menus and modals (text_muted 10% over surface).

menu_selected = "#404345" # Any selected menu/picker/suggestion row (highlight_bg 20% over surface).

menu_border = "#34363a" # Borders in and around menus, modals, popovers and drag chips (text_muted 35% over surface).

danger_border = "#64302d" # Confirm-prompt destructive button border (error 50% over surface).

danger_wash = "#302324" # That button's hover fill (error 12% over surface).
