# Derived colors below the base nine are generated — after changing a base
# color, refresh them with: python themes/generate_desktop.py

primary = "#8296ca" # Accent: active tabs, the seek bar, links, the playing-track marker.

secondary = "#b2c6e0" # Second accent: liked-track hearts, the condensed lyric line's neighbours.

background = "#1A1B26" # The window background.

surface = "#292e42" # Elevated panels: menus, modals, popovers, the titlebar.

text = "#A9B1D6" # Main text.

text_muted = "#596180" # Secondary text: artist/album columns, hints, timestamps, inactive icons.

highlight_bg = "#609bc2" # Selection source color; selected rows derive their fill from this.

highlight_fg = "#2e3450" # Text on strong highlights (the TUI's selected rows).

error = "#e7403a" # Errors: failure messages and the audio-device banner.

row_selected = "#262e48" # Any selected row/chip over the window: lists, sidebar, the command-bar suggestion (highlight_bg 20% over background).

row_hover = "#20222f" # Any hovered row over the window: sidebar, lists, tabs, links, range pills (text_muted 10% over background).

wash = "#232634" # Muted fills: placeholder cover boxes, small button hovers, disabled buttons (text_muted 15% over background).

border = "#2d3041" # Window-level borders, pill outlines and the seek/volume bar track (text_muted 30% over background).

drag_target = "#272d45" # Drag feedback: drop targets while dragging and the sidebar resize handle (primary 20% over background).

like_dim = "#333b49" # The faint heart on a not-liked track; hovering shows secondary itself (secondary 25% over background).

error_wash = "#392129" # The audio-device failure banner fill (error 15% over background).

menu_hover = "#2e3348" # Any hovered row, button or titlebar caption in menus and modals (text_muted 10% over surface).

menu_selected = "#34445c" # Any selected menu/picker/suggestion row (highlight_bg 20% over surface).

menu_border = "#3a4058" # Borders in and around menus, modals, popovers and drag chips (text_muted 35% over surface).

danger_border = "#88373e" # Confirm-prompt destructive button border (error 50% over surface).

danger_wash = "#403041" # That button's hover fill (error 12% over surface).
