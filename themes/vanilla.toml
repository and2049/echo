# Derived colors below the base nine are generated — after changing a base
# color, refresh them with: python themes/generate_desktop.py

primary = "#a47838" # Accent: active tabs, the seek bar, links, the playing-track marker.

secondary = "#ac8341" # Second accent: liked-track hearts, the condensed lyric line's neighbours.

background = "#ecead9" # The window background.

surface = "#f7f5e9" # Elevated panels: menus, modals, popovers, the titlebar.

text = "#70624e" # Main text.

text_muted = "#88795e" # Secondary text: artist/album columns, hints, timestamps, inactive icons.

highlight_bg = "#a48b4f" # Selection source color; selected rows derive their fill from this.

highlight_fg = "#3a3227" # Text on strong highlights (the TUI's selected rows).

error = "#a8423e" # Errors: failure messages and the audio-device banner.

row_selected = "#ded7bd" # Any selected row/chip over the window: lists, sidebar, the command-bar suggestion (highlight_bg 20% over background).

row_hover = "#e2dfcd" # Any hovered row over the window: sidebar, lists, tabs, links, range pills (text_muted 10% over background).

wash = "#ddd9c7" # Muted fills: placeholder cover boxes, small button hovers, disabled buttons (text_muted 15% over background).

border = "#cec8b4" # Window-level borders, pill outlines and the seek/volume bar track (text_muted 30% over background).

drag_target = "#ded3b9" # Drag feedback: drop targets while dragging and the sidebar resize handle (primary 20% over background).

like_dim = "#b7ab8c" # The faint heart on a not-liked track; hovering shows secondary itself (secondary 25% over background).

error_wash = "#e2d1c2" # The audio-device failure banner fill (error 15% over background).

menu_hover = "#ece9db" # Any hovered row, button or titlebar caption in menus and modals (text_muted 10% over surface).

menu_selected = "#e6e0ca" # Any selected menu/picker/suggestion row (highlight_bg 20% over surface).

menu_border = "#d0cab8" # Borders in and around menus, modals, popovers and drag chips (text_muted 35% over surface).

danger_border = "#d09c94" # Confirm-prompt destructive button border (error 50% over surface).

danger_wash = "#eee0d4" # That button's hover fill (error 12% over surface).
